# Blueprint für Render (Frankfurt).
# Deploy: https://dashboard.render.com → New → Blueprint → ASCLAJEN/sportverein.lajen

services:
  - type: web
    name: asclajen
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/ASCLAJEN/sportverein.lajen.git
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: asclajen-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Security release Okt 2026 (CVE-2026-111497 u. a.) – mind. 22.23.4
      - key: NODE_VERSION
        value: "22.23.4"
      - key: DATABASE_URL
        fromDatabase:
          name: asclajen-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.asclajen.com
      # Fallback = Hauptverein-Konto, wenn die Sektion keine eigenen Keys hat.
      # Pro Sektion als zusätzliche Secret-Env-Variablen pflegen, z. B.
      # PAYMENT_TENNIS_STRIPE_SECRET_KEY / PAYMENT_TENNIS_STRIPE_WEBHOOK_SECRET
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Zahlungsdaten werden aus Sicherheitsgründen ausschließlich in Render gepflegt.
      # Pro Sektion z. B. PAYMENT_TENNIS_BANK_IBAN / PAYMENT_TENNIS_BANK_ACCOUNT_HOLDER
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_POSTGRES_ID
        sync: false
      - key: CRON_SECRET
        # Einmal in Render setzen – nicht automatisch neu erzeugen.
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Optional. Backup-Mail Abos/Kurse (Standard: info@asclajen.com).
      - key: REGISTRATION_BACKUP_EMAIL
        sync: false

  # Stündlich (UTC): Abo-Verlängerungen + abgelaufene Wartelisten-Angebote.
  # Ruft die Web-App auf; CRON_SECRET muss mit dem Web-Service übereinstimmen.
  - type: cron
    name: asclajen-renewals
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/ASCLAJEN/sportverein.lajen.git
    branch: main
    schedule: "15 * * * *"
    buildCommand: "true"
    startCommand: node scripts/trigger-renewals-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.asclajen.com

  # Montag + Donnerstag 06:00 UTC (08:00 Sommer / 07:00 Winter in Lajen):
  # Excel-Backup Abos + Kurse per E-Mail.
  - type: cron
    name: asclajen-registration-backup
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/ASCLAJEN/sportverein.lajen.git
    branch: main
    schedule: "0 6 * * 1,4"
    buildCommand: "true"
    startCommand: node scripts/trigger-registration-backup-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.asclajen.com

databases:
  - name: asclajen-db
    region: frankfurt
    plan: basic-256mb
    databaseName: asclajen
    user: asclajen
