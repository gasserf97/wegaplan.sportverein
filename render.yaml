# Neues Multi-Verein-Blueprint – eigene Resource-Namen.
# Legt eine zweite Render-Instanz an und lässt die bestehende
# ASC-Lajen-Instanz (asclajen / asclajen-db) unberührt.
# Deploy: Render → New → Blueprint → Branch cursor/multi-club-subdomains-1718

services:
  - type: web
    name: wegaplan
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/gasserf97/wegaplan.sportverein.git
    branch: cursor/multi-club-subdomains-1718
    # Build hat kein privates Netz: die interne DB-URL (dpg-…-a) ist dort nicht erreichbar.
    buildCommand: npm ci && npx prisma generate && npm run build
    # Seed legt die Beispiel-Zugänge, Kurse und Mitgliedschaften an (Upserts, kein Löschen).
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: wegaplan-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Security release Okt 2026 (CVE-2026-111497 u. a.) – mind. 22.23.4
      - key: NODE_VERSION
        value: "22.23.4"
      - key: DATABASE_URL
        fromDatabase:
          name: wegaplan-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://www.wegaclub.com
      # Vorführung: ohne Stripe-Schlüssel lokaler Test-Checkout (Karte 4242…).
      - key: SHOWCASE_MODE
        value: "1"
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      # Plattform-Konto für Stripe Connect. Vereinskonten legt die App an.
      - key: STRIPE_CONNECT_SECRET_KEY
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      # Mail/Zahlung/Backup pro Verein in der Super-Admin-UI; Env nur Fallback für Lajen.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_POSTGRES_ID
        sync: false
      - key: CRON_SECRET
        # Einmal in Render setzen – nicht automatisch neu erzeugen.
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: REGISTRATION_BACKUP_EMAIL
        sync: false
      # Hauptdomain = Super-Admin unter www.wegaclub.com.
      # Vereine: slug.wegaclub.com (Wildcard-DNS, nicht *.onrender.com).
      - key: PLATFORM_DOMAIN
        value: wegaclub.com
      - key: CLUB_SECRETS_KEY
        sync: false
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false

  # Stündlich (UTC): Abo-Verlängerungen + abgelaufene Wartelisten-Angebote.
  # Ruft die Web-App auf; CRON_SECRET muss mit dem Web-Service übereinstimmen.
  - type: cron
    name: wegaplan-renewals
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/gasserf97/wegaplan.sportverein.git
    branch: cursor/multi-club-subdomains-1718
    schedule: "15 * * * *"
    buildCommand: "true"
    startCommand: node scripts/trigger-renewals-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://wegaplan.onrender.com

  # Montag + Donnerstag 06:00 UTC: Excel-Backup Abos + Kurse per E-Mail.
  - type: cron
    name: wegaplan-registration-backup
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/gasserf97/wegaplan.sportverein.git
    branch: cursor/multi-club-subdomains-1718
    schedule: "0 6 * * 1,4"
    buildCommand: "true"
    startCommand: node scripts/trigger-registration-backup-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://wegaplan.onrender.com

databases:
  - name: wegaplan-db
    region: frankfurt
    plan: basic-256mb
    databaseName: wegaplan
    user: wegaplan
