services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asclajen
      POSTGRES_PASSWORD: asclajen
      POSTGRES_DB: asclajen
    ports:
      - "5432:5432"
    volumes:
      - asclajen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asclajen -d asclajen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asclajen_pg:
